<style>
  form[name="contact"] {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f9f9f9;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    font-family: Arial, sans-serif;
}

form[name="contact"] p {
    margin-bottom: 15px;
}

form[name="contact"] label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #333;
}

form[name="contact"] input[type="text"],
form[name="contact"] input[type="email"],
form[name="contact"] select,
form[name="contact"] textarea {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
}

form[name="contact"] input[type="text"]:focus,
form[name="contact"] input[type="email"]:focus,
form[name="contact"] select:focus,
form[name="contact"] textarea:focus {
    border-color: #66afe9;
    outline: none;
}

form[name="contact"] select {
    height: 40px;
}

form[name="contact"] textarea {
    height: 100px;
    resize: vertical;
}

form[name="contact"] button[type="submit"] {
    display: inline-block;
    padding: 10px 20px;
    font-size: 16px;
    color: #fff;
    background-color: #28a745;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

form[name="contact"] button[type="submit"]:hover {
    background-color: #218838;
}

</style>

</head>

    <div class="container">
      <form name="contact" method="POST" data-netlify="true">
        <p>
          <label>Your Name: <input type="text" name="name" /></label>
        </p>
        <p>
          <label>Your Email: <input type="email" name="email" /></label>
        </p>
        <p>
          <label>Your Role: <select name="role[]" multiple>
            <option value="leader">Leader</option>
            <option value="follower">Follower</option>
          </select></label>
        </p>
        <p>
          <label>Message: <textarea name="message"></textarea></label>
        </p>
        <p>
          <button type="submit">Send</button>
        </p>
      </form>
      
  </div>
